name: Native Player Hosted

on:
  pull_request:
    paths:
      - "port/net/native_host.*"
      - "port/net/nat_forward.*"
      - "port/res/dhd.rc"
      - "port/include/version.h"
      - "port/tools/release_safety.py"
      - "port/net/player_host.*"
      - "port/net/native_host_test_main.c"
      - "port/net/test_native_host.py"
      - "port/net/test_direct_host_contract.py"
      - "port/hle/online_menu.c"
      - ".github/workflows/native-player-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-host-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile truthful Windows resources
        shell: cmd
        run: >
          llvm-rc /I port/include /fo native_test.res port/res/dhd.rc
      - name: Build native Windows relay (no ISO needed)
        shell: cmd
        run: >
          cl /nologo /W3 /utf-8 /Fe:native_host_test.exe
          port/net/native_host_test_main.c
          port/net/native_host.c
          port/net/json.c
          native_test.res
          ws2_32.lib bcrypt.lib
      - name: Verify Windows PE version metadata without executing it
        shell: pwsh
        run: python port/tools/release_safety.py .\\native_host_test.exe
      - name: Test WebSocket lobby and race relay
        shell: pwsh
        run: python port/net/test_native_host.py .\native_host_test.exe
      - name: Verify local public and private room routing
        shell: pwsh
        run: python port/net/test_direct_host_contract.py
