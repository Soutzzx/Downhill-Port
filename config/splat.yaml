  asset_path: assets
  # include/{macro,labels}.inc and include_asm.h are project-owned now.
  generate_asm_macros_files: False
  gp_value: 0x002A40F0
  section_order: [".text", ".vutext", ".data", ".rodata", ".gcc_except_table", ".sdata", ".sbss", ".bss"]
  string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

