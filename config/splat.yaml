    type: code
    start: 0x1000
    vram: 0x0010A000
    bss_size: 0x602710   # counted from the end of .sdata (0x29DCF0) to the end of .bss (0x8A0400)
    subsegments:
      - [0x1000, c, text]
      - [0x15ABC0, bin, vutext]
      - [0x164D00, data, data]
      - [0x17F870, pad, pad_data]
      - [0x17F880, rodata, rodata]
      - [0x192F58, pad, pad_rodata]
      - [0x192F80, gcc_except_table, gcc_except_table]
      - [0x1930C8, pad, pad_except]
      - [0x193100, sdata, sdata]
      - { start: 0x194CF0, type: sbss, vram: 0x0029DD00, name: sbss }
      - { start: 0x194CF0, type: bss, vram: 0x0029E580, name: bss }
  - [0x194CF0]
